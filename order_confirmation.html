<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Order Receipt | PawCare</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="pawcare-logo.png">
  <link rel="stylesheet" href="styles-clean.css">
  <link rel="stylesheet" href="visual-upgrade.css">
</head>
<body class="receipt-page">
  <main class="receipt-wrap">
    <article class="receipt-card">
      <header class="receipt-head">
        <div class="receipt-brand"><span>🐾</span> PawCare</div>
        <div class="receipt-status"><strong>✓ Order confirmed</strong><div id="receiptDate"></div></div>
      </header>
      <div class="receipt-body">
        <div class="receipt-meta">
          <div><small>Receipt number</small><b id="receiptId">Loading...</b></div>
          <div><small>Payment method</small><b id="receiptPayment">—</b></div>
          <div><small>Order status</small><b id="receiptStatus">Placed</b></div>
        </div>
        <section class="receipt-items" id="receiptItems"><div class="receipt-item">Loading receipt...</div></section>
        <section class="receipt-totals">
          <div><span>Subtotal</span><b id="receiptSubtotal">₱0.00</b></div>
          <div><span>Shipping</span><b id="receiptShipping">₱0.00</b></div>
          <div class="total"><span>Total</span><b id="receiptTotal">₱0.00</b></div>
        </section>
      </div>
      <footer class="receipt-actions">
        <button class="print-btn" type="button" onclick="window.print()">Print receipt</button>
        <a class="shop-btn" href="Dogs.html">Continue shopping</a>
        <a class="shop-btn" href="account.html#orders">View my orders</a>
      </footer>
    </article>
  </main>
  <script src="visual-upgrade.js"></script>
  <script>
    const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
    const id=new URLSearchParams(location.search).get('id');
    document.getElementById('receiptId').textContent=id?'PC-'+String(id).padStart(6,'0'):'—';
    document.getElementById('receiptDate').textContent=new Date().toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'});
    fetch('api/orders.php',{credentials:'same-origin'}).then(r=>r.json()).then(data=>{
      const order=(data.orders||[]).find(x=>String(x.id)==String(id));
      if(!order){document.getElementById('receiptItems').innerHTML='<div class="receipt-item">Your order is confirmed. Open My Orders for complete details.</div>';return}
      document.getElementById('receiptPayment').textContent=order.payment_method==='cod'?'Cash on delivery':String(order.payment_method||'—').toUpperCase();
      document.getElementById('receiptStatus').textContent=String(order.order_status||'placed').replace(/^\w/,c=>c.toUpperCase());
      document.getElementById('receiptItems').innerHTML=(order.items||[]).map(i=>`<div class="receipt-item"><span>${i.name} × ${i.qty}</span><b>${money(Number(i.price)*Number(i.qty))}</b></div>`).join('');
      document.getElementById('receiptSubtotal').textContent=money(order.subtotal);
      document.getElementById('receiptShipping').textContent=money(order.shipping_fee);
      document.getElementById('receiptTotal').textContent=money(order.total);
    }).catch(()=>{
      document.getElementById('receiptItems').innerHTML='<div class="receipt-item">Receipt details will appear in My Orders.</div>';
    });
  </script>
</body>
</html>
